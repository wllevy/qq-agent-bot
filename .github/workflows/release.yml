name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  verify:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Validate version
        shell: bash
        run: |
          node -e 'if (process.env.GITHUB_REF_NAME !== "v" + JSON.parse(require("fs").readFileSync("package.json")).version) process.exit(1)'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run package:release
      - name: Test npm installation and upgrades
        shell: bash
        run: |
          version=$(node -p 'require("./package.json").version')
          npm run smoke:install -- "release/qq-agent-bot-$version.tgz"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: npm-package
          path: release/*.tgz
  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: release
      - name: Publish GitHub assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./package.json").version')
          release_flags=()
          if ! npm view "qq-agent-bot@$version" version >/dev/null 2>&1; then
            release_flags=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" release/*.tgz scripts/install.ps1 scripts/install.sh scripts/npm-install.mjs --verify-tag --generate-notes --title "QQ Agent Bot $GITHUB_REF_NAME" "${release_flags[@]}"
